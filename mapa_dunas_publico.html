<script>
(function() {
  var svg = document.getElementById('plano-svg');
  var g = document.getElementById('zoomable');
  var scale = 1, panX = 0, panY = 0;
  var MIN_SCALE = 1, MAX_SCALE = 10;

  function applyTransform() {
    g.setAttribute('transform', 'translate(' + panX + ',' + panY + ') scale(' + scale + ')');
  }

  function clientToSvgPoint(clientX, clientY) {
    var pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    var ctm = svg.getScreenCTM();
    return pt.matrixTransform(ctm.inverse());
  }

  function zoomAt(clientX, clientY, factor) {
    var before = clientToSvgPoint(clientX, clientY);
    var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    if (newScale === scale) return;
    // Convert 'before' (in current transformed space) back to pre-transform coords
    var localX = (before.x - panX) / scale;
    var localY = (before.y - panY) / scale;
    scale = newScale;
    panX = before.x - localX * scale;
    panY = before.y - localY * scale;
    clampPan();
    applyTransform();
  }

  function clampPan() {
    // keep at least a little of the drawing on screen; simple clamp based on scale
    var maxPanMag = 4623 * (scale - 1) + 500;
    if (scale === 1) { panX = 0; panY = 0; return; }
    panX = Math.min(maxPanMag, Math.max(-maxPanMag, panX));
    panY = Math.min(maxPanMag, Math.max(-maxPanMag, panY));
  }

  svg.addEventListener('wheel', function(ev) {
    ev.preventDefault();
    var factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(ev.clientX, ev.clientY, factor);
  }, { passive: false });

  // Mouse drag to pan
  var isDragging = false, lastX = 0, lastY = 0;
  svg.addEventListener('mousedown', function(ev) {
    if (scale === 1) return;
    isDragging = true;
    lastX = ev.clientX; lastY = ev.clientY;
    svg.classList.add('dragging');
  });
  window.addEventListener('mousemove', function(ev) {
    if (!isDragging) return;
    panX += (ev.clientX - lastX);
    panY += (ev.clientY - lastY);
    lastX = ev.clientX; lastY = ev.clientY;
    clampPan();
    applyTransform();
  });
  window.addEventListener('mouseup', function() {
    isDragging = false;
    svg.classList.remove('dragging');
  });

  // Double-click to reset
  svg.addEventListener('dblclick', function() {
    scale = 1; panX = 0; panY = 0;
    applyTransform();
  });

  // Touch: single-finger pan, two-finger pinch zoom
  var touchState = null;
  function dist(t0, t1) {
    var dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function midpoint(t0, t1) {
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }
  svg.addEventListener('touchstart', function(ev) {
    if (ev.touches.length === 1) {
      touchState = { mode: 'pan', lastX: ev.touches[0].clientX, lastY: ev.touches[0].clientY };
    } else if (ev.touches.length === 2) {
      touchState = { mode: 'pinch', lastDist: dist(ev.touches[0], ev.touches[1]) };
    }
  }, { passive: true });
  svg.addEventListener('touchmove', function(ev) {
    if (!touchState) return;
    ev.preventDefault();
    if (touchState.mode === 'pan' && ev.touches.length === 1 && scale > 1) {
      var t = ev.touches[0];
      panX += (t.clientX - touchState.lastX);
      panY += (t.clientY - touchState.lastY);
      touchState.lastX = t.clientX; touchState.lastY = t.clientY;
      clampPan();
      applyTransform();
    } else if (touchState.mode === 'pinch' && ev.touches.length === 2) {
      var newDist = dist(ev.touches[0], ev.touches[1]);
      var factor = newDist / touchState.lastDist;
      var mid = midpoint(ev.touches[0], ev.touches[1]);
      zoomAt(mid.x, mid.y, factor);
      touchState.lastDist = newDist;
    }
  }, { passive: false });
  svg.addEventListener('touchend', function(ev) {
    if (ev.touches.length === 0) touchState = null;
  });
})();
</script>
